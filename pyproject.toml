[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-sticker-maker"
version = "0.1.0"
description = "ChatGPT / Codex 微信 AI 表情包 Skill & CLI Pipeline"
readme = "README.md"
authors = [{ name = "WeChat Sticker Maker Team" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
wechat-sticker-maker = "sticker_maker.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

