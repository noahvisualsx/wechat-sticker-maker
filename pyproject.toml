[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-sticker-maker"
version = "1.0.0"
description = "Real-person AI sticker & meme pack engine for WeChat and 23 social platforms (108 photographic styles, 168 duo presets, 220 expressions, 40 pet presets, 60 memes, multi-frame GIFs)"
readme = "README.md"
authors = [{ name = "noahvisualsx" }]
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = [
    "wechat",
    "sticker-maker",
    "meme-generator",
    "ai-stickers",
    "telegram-stickers",
    "line-stickers",
    "kakaotalk",
    "claude-code",
    "codex",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "pillow>=10.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/noahvisualsx/wechat-sticker-maker"
Repository = "https://github.com/noahvisualsx/wechat-sticker-maker.git"
Issues = "https://github.com/noahvisualsx/wechat-sticker-maker/issues"
Gallery = "https://github.com/noahvisualsx/wechat-sticker-maker/blob/main/docs/gallery/README.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
wechat-sticker-maker = "sticker_maker.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
